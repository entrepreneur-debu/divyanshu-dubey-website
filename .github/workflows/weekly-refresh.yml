# Rebuilds the site every Sunday evening (8:30 pm IST) so the newest
# "This Week in AI" edition appears without you doing anything.
# Setup: in Vercel, Project > Settings > Git > Deploy Hooks, create a hook,
# then add its URL to this GitHub repo as the secret VERCEL_DEPLOY_HOOK.
name: Weekly refresh
on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel rebuild
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
